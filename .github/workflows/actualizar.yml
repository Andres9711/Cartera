name: Actualizar datos y publicar

on:
  schedule:
    - cron: "30 22 * * 1-5"   # lunes a viernes, 19:30 hora de Argentina
  workflow_dispatch:           # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["index.html", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar datos de mercado
        id: update
        continue-on-error: true
        run: python scripts/update_market.py
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || (git commit -m "Actualizar datos de mercado" && git pull --rebase -q && git push)
      - name: Armar sitio
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Avisar si alguna fuente falló
        if: steps.update.outcome == 'failure'
        run: |
          echo "Alguna fuente de datos falló. Revisá el paso 'Bajar datos de mercado'."
          exit 1

  deploy:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
