<title>Tablero de Cartera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger-style dashboard. Sticky masthead, hairline-ruled KPI strip, tabbed sections; figures in mono. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --ink:#0d1726; --ink-2:#465266; --ink-3:#74809a;
  --line:#dbe1ea; --line-2:#c8d0dd; --accent:#1c46c8; --accent-ink:#ffffff; --accent-soft:#e3eaff;
  --pos:#0a7d58; --neg:#c8303f; --warn:#a86a00; --pos-soft:#dff3ea; --neg-soft:#fbe4e7; --warn-soft:#fbefd2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --sother:#9aa5b8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(13,23,38,.06),0 6px 20px rgba(13,23,38,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a101c; --surface:#121a2a; --surface-2:#1a2438; --ink:#eaeff8; --ink-2:#b2bdd1; --ink-3:#7f8ca6;
  --line:#243049; --line-2:#33425f; --accent:#7ba0ff; --accent-ink:#0a101c; --accent-soft:#1a2745;
  --pos:#3fcf9b; --neg:#ff7a86; --warn:#e8b04a; --pos-soft:#123a2e; --neg-soft:#44202a; --warn-soft:#3b2f12;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2a9d2a; --s7:#9085e9; --s8:#e66767; --sother:#5d6b86;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a101c; --surface:#121a2a; --surface-2:#1a2438; --ink:#eaeff8; --ink-2:#b2bdd1; --ink-3:#7f8ca6;
  --line:#243049; --line-2:#33425f; --accent:#7ba0ff; --accent-ink:#0a101c; --accent-soft:#1a2745;
  --pos:#3fcf9b; --neg:#ff7a86; --warn:#e8b04a; --pos-soft:#123a2e; --neg-soft:#44202a; --warn-soft:#3b2f12;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2a9d2a; --s7:#9085e9; --s8:#e66767; --sother:#5d6b86;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--ink-3)}
/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.mast-in{max-width:1240px;margin:0 auto}
.mast-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font:700 22px/1 var(--f-display);margin:0;letter-spacing:-.02em}
.brand small{color:var(--ink-3);font-size:12px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:500;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:9px 13px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;font-size:13.5px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main{padding-top:20px;display:flex;flex-direction:column;gap:20px}
/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;background:var(--surface-2);font-size:13px}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.banner b{font-weight:600}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:28px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.hero .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.hero .big{font:700 clamp(34px,5.6vw,58px)/1.02 var(--f-display);letter-spacing:-.03em;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.hero .sub{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.pill{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:500;font-family:var(--f-mono)}
.pill.pos{background:var(--pos-soft)} .pill.neg{background:var(--neg-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-bottom:1px solid var(--line)}
.kpi{padding:14px 16px 14px 0;min-width:0}
.kpi + .kpi{padding-left:16px;border-left:1px solid var(--line)}
.kpi .lbl{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.kpi .val{font:500 19px/1.25 var(--f-mono);margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .note{font-size:12px;color:var(--ink-3);margin-top:1px}
@media(max-width:700px){.hero{grid-template-columns:1fr;gap:16px}.kpi + .kpi{border-left:0;padding-left:0}.kpi{border-bottom:1px solid var(--line)}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(odd){padding-right:12px}.kpi:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}}
/* panels */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font:600 15px/1.3 var(--f-body);margin:0 0 2px}
.panel .hint{color:var(--ink-3);font-size:12.5px;margin:0 0 12px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;white-space:nowrap;z-index:5;box-shadow:var(--shadow);transform:translate(-50%,0)}
.tip b{font-weight:600}
.tip .r{display:flex;gap:10px;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* bars list */
.hb{display:grid;grid-template-columns:minmax(64px,92px) 1fr auto;gap:5px 10px;align-items:center;font-size:13px}
.hb .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:10px;background:var(--surface-2);border-radius:3px;position:relative}
.hb .tr span{position:absolute;left:0;top:0;bottom:0;border-radius:3px 4px 4px 3px}
.stackbar{display:flex;height:14px;gap:2px;border-radius:4px;overflow:hidden;margin:4px 0 6px}
.stackbar span{display:block;min-width:2px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--surface);position:sticky;top:0;cursor:default}
th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--ink)}
th[aria-sort] {color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
tbody tr.row:hover td{background:var(--surface-2)}
tr.det td{background:var(--surface-2);padding:10px 16px;white-space:normal;text-align:left}
td.tk{font-weight:600}
.badge{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2)}
.badge.buy{background:var(--accent-soft);color:var(--accent)} .badge.sell{background:var(--warn-soft);color:var(--warn)}
.w{display:inline-block;width:56px;height:6px;background:var(--surface-2);border-radius:3px;vertical-align:middle;margin-right:8px;position:relative}
.w b{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:3px}
.flt{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flt input[type=search],.flt select,.in{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.empty{border:1.5px dashed var(--line-2);border-radius:14px;padding:44px 24px;text-align:center;background:var(--surface)}
.empty h2{font:700 26px/1.15 var(--f-display);margin:0 0 8px;letter-spacing:-.02em}
.empty p{color:var(--ink-2);max-width:56ch;margin:0 auto 18px}
.drop{outline:2px dashed var(--accent);outline-offset:-8px}
.ds{display:grid;gap:10px}
.ds textarea{width:100%;min-height:64px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);padding:8px 10px;font:12px/1.4 var(--f-mono);resize:vertical}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;font-size:12px;padding:2px 10px;font-weight:500}
.chip.ok{background:var(--pos-soft);color:var(--pos)} .chip.no{background:var(--warn-soft);color:var(--warn)}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;box-shadow:var(--shadow);font-size:13px;max-width:90vw}
details summary{cursor:pointer;font-weight:500}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.cmp>div{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.cmp>div:last-child{border-right:0}
.cmp .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:500;display:flex;gap:8px;align-items:center}
.cmp .lbl i{width:9px;height:9px;border-radius:2px;display:inline-block}
.cmp .v{font:500 18px/1.3 var(--f-mono);margin-top:4px}
.heat td.c{font-family:var(--f-mono);font-size:12px}
@media(prefers-reduced-motion:no-preference){.panel,.kpi{animation:fade .35s ease both}@keyframes fade{from{opacity:.001;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header class="mast"><div class="mast-in">
    <div class="mast-row">
      <div class="brand"><h1>Tablero de Cartera</h1><small id="meta"></small></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Moneda"><button id="cARS" data-act="cur" data-v="ARS" aria-pressed="true">ARS</button><button id="cUSD" data-act="cur" data-v="USD" aria-pressed="false">USD</button></div>
        <div class="seg" role="group" aria-label="Método de costo" title="Cómo se calcula el costo de lo vendido"><button data-act="method" data-v="avg" aria-pressed="true">Costo prom.</button><button data-act="method" data-v="fifo" aria-pressed="false">FIFO</button></div>
        <button class="btn primary" data-act="pick">Cargar Excel</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div></header>
  <main id="view"></main>
</div>
<input type="file" id="fileExcel" accept=".xlsx,.xls,.csv" hidden>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(()=>{
"use strict";
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const DAY=86400000;
const dn=(y,m,d)=>Math.round(Date.UTC(y,m-1,d)/DAY);
const dstr=t=>{const x=new Date(t*DAY);return x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0')+'-'+String(x.getUTCDate()).padStart(2,'0')};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dlab=t=>{const x=new Date(t*DAY);return x.getUTCDate()+' '+MES[x.getUTCMonth()]+' '+String(x.getUTCFullYear()).slice(2)};
const mlab=t=>{const x=new Date(t*DAY);return MES[x.getUTCMonth()]+' '+String(x.getUTCFullYear()).slice(2)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const normTk=s=>String(s??'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return dn(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'){ if(v>20000&&v<80000)return Math.round(v-25569); return null }
  const s=String(v).trim(); let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return dn(+m[1],+m[2],+m[3]);
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/)){const y=+m[3]<100?2000+ +m[3]:+m[3];return dn(y,+m[2],+m[1])}
  if(m=s.match(/^(\d{4})-(\d{1,2})$/))return dn(+m[1],+m[2],1);
  return null;
}
function num(v){
  if(typeof v==='number')return v;
  if(v==null)return NaN;
  let s=String(v).trim().replace(/[$%\s]|US|USD/g,'');
  if(!s)return NaN;
  if(s.includes(',')&&s.includes('.')){s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(s.includes(','))s=s.replace(',','.');
  return parseFloat(s);
}
const nfARS=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const nfUSD=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfUSD0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const nfC=new Intl.NumberFormat('es-AR',{notation:'compact',maximumFractionDigits:1});
const nfQ=new Intl.NumberFormat('es-AR',{maximumFractionDigits:4});
const nfP=new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
const MINUS='−';
function money(v,cur,o={}){
  if(v==null||!isFinite(v))return '—';
  const sg=o.sign&&v>0?'+':(v<0?MINUS:''); const a=Math.abs(v);
  let b;
  if(cur==='USD')b='US$ '+(o.compact&&a>=1e3?nfC.format(a):(a>=1e4?nfUSD0:nfUSD).format(a));
  else b='$ '+(o.compact&&a>=1e5?nfC.format(a):nfARS.format(a));
  return sg+b;
}
function pct(v,o={}){ if(v==null||!isFinite(v))return '—'; const s=(Math.abs(v)*100).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}); return (v<0?MINUS:(o.sign&&v>0?'+':''))+s+'%' }
const cls=v=>v>0?'pos':(v<0?'neg':'');
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3800)}

/* ============ almacenamiento ============ */
const LS='cartera.v1.';
const store={
  db:null,uid:null,
  async init(){
    try{
      const [db,user]=await Promise.all([window.claude?.use?.('db'),window.claude?.use?.('user')]);
      if(db&&user){this.db=db;this.uid=await user.id()}
    }catch(e){}
  },
  col(){return this.db.collection('data/users/'+this.uid)},
  async load(){
    const out={movs:{},mkt:null,meta:null};
    if(this.db){
      try{
        const snap=await this.col().get();
        snap.docs.forEach(d=>{const id=d.id,x=d.data(); if(id.startsWith('mov-'))out.movs[id]=JSON.parse(JSON.stringify(x.rows||[])); else if(id==='mkt')out.mkt=x; else if(id==='meta')out.meta=x});
        return out;
      }catch(e){console.warn('db',e)}
    }
    try{
      const raw=localStorage.getItem(LS+'all'); if(raw){const o=JSON.parse(raw); return {movs:o.movs||{},mkt:o.mkt||null,meta:o.meta||null}}
    }catch(e){}
    return out;
  },
  async save(kind,key,data){
    if(this.db){try{await this.col().doc(key).set(data);return}catch(e){console.warn(e);toast('No se pudo guardar en la base de la página. Queda solo en este navegador.')}}
    try{
      const raw=localStorage.getItem(LS+'all');const o=raw?JSON.parse(raw):{movs:{}};
      if(kind==='mov'){o.movs=o.movs||{};o.movs[key]=data.rows} else o[kind]=data;
      localStorage.setItem(LS+'all',JSON.stringify(o));
    }catch(e){toast('No se pudo guardar en este navegador')}
  },
  async wipe(keys){
    if(this.db){for(const k of keys){try{await this.col().doc(k).delete()}catch(e){}}}
    try{localStorage.removeItem(LS+'all')}catch(e){}
  }
};

/* ============ normalización del Excel del broker ============ */
function normalizeRow(r){
  // r: raw {d,k,y,c,q,p,l,m,a}
  const parts=String(r.d||'').split(' / ').map(s=>s.trim());
  const head=parts[0];
  const t=parseDate(r.c), ts=parseDate(r.l)??t;
  if(t==null)return null;
  const mon=norm(r.m);
  const cur=mon.startsWith('peso')?'ARS':(mon.startsWith('dolar')?'USD':'ARS');
  const m={desc:r.d,tk:r.k?normTk(r.k):null,tipo:r.y||null,t,ts,qty:+r.q||0,price:+r.p,amt:+r.a||0,cur,cls:'other',side:null,idn:+(parts[1]||0)||0};
  const h=norm(head);
  if(h==='boleto'){
    const side=(parts[2]||'').toUpperCase();
    if(side.startsWith('APCOL'))m.cls='caucion';
    else if((side==='COMPRA'||side==='VENTA')&&m.tk){m.cls='trade';m.side=side}
  }else if(h.startsWith('dividendo en efectivo')||h==='renta'||h.startsWith('amortiz'))m.cls='income';
  else if(h.startsWith('dividendo en acciones'))m.cls='split';
  else if(h==='recibo de cobro')m.cls='deposit';
  else if(h==='comprobante de pago')m.cls='withdrawal';
  else if(/suscripci|rescate/.test(h))m.cls='fund';
  return m;
}
const HDR={descripcion:'d',ticker:'k','tipo de instrumento':'y',concertacion:'c',cantidad:'q',precio:'p',liquidacion:'l',moneda:'m',importe:'a'};
function rawFromSheet(rows){
  const out=[];
  for(const r of rows){
    const o={};

function benchmarks(M,mkt){

  if(M.hasFx){
    // comprar dólares con cada aporte
    let usd=0;for(const f of flows)usd+=f.a/M.fxAt(f.t);
    const valA=usd*M.fxNow;
    const fl=flows.map(f=>({t:f.t,v:-f.a}));fl.push({t:nowT,v:valA});

  }

  res.spyAdj=null;
  for(const sp of M.splits.filter(x=>x.tk==='SPY'&&x.f>1.2)){
    // si la serie viene del CEDEAR sin ajustar, cae ~f veces al partirse: se corrige hacia atrás
    const i=lastLE(spy,sp.t-1),j=spy.findIndex(x=>x.t>=sp.t);
    if(i>=0&&j>=0){const a=spy.slice(Math.max(0,i-4),i+1).reduce((s,x)=>s+x.v,0)/Math.min(5,i+1),b=spy.slice(j,j+5).reduce((s,x)=>s+x.v,0)/Math.min(5,spy.length-j);
      if(a/b>sp.f*0.7){for(const x of spy)if(x.t<sp.t)x.v/=sp.f;res.spyAdj={f:sp.f,t:sp.t}}}

async function persistMkt(){await store.save('mkt','mkt',{fx:state.mkt.fx,spy:state.mkt.spy,ipc:state.mkt.ipc,prices:state.mkt.prices,hist:state.mkt.hist,fxManual:state.mkt.fxManual,sectors:state.mkt.sectors||{}})}
function mergeMkt(x){ if(!x)return; x=JSON.parse(JSON.stringify(x)); for(const k of ['fx','spy','ipc'])state.mkt[k]=x[k]||[]; state.mkt.prices=x.prices||{};state.mkt.hist=x.hist||{};state.mkt.fxManual=+x.fxManual||0;state.mkt.sectors=x.sectors||{} }
async function importExcel(file){
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null,raw:true});
    const inc=rawFromSheet(rows);
    if(!inc.length){toast('No encontré movimientos. Revisá que sea el Excel de movimientos del broker.');return}
    if(state.demo){state.demo=false}
    const existing=rawList();const {rows:merged,added}=mergeRaw(existing,inc);
    const shards={};for(const r of merged)(shards[shardOf(r)]||(shards[shardOf(r)]=[])).push(r);
    // guardar solo los meses que cambiaron
    for(const k in shards){const old=state.raw[k]||[];if(old.length!==shards[k].length){state.raw[k]=shards[k];await store.save('mov',k,{rows:shards[k]})}}
    state.meta={at:new Date().toISOString(),n:merged.length};await store.save('meta','meta',state.meta);
    recompute();render();
    toast(added?`Listo: ${added} movimientos nuevos (${merged.length} en total)`:'No había movimientos nuevos. Todo estaba al día.');
  }catch(e){console.error(e);toast('No pude leer ese archivo.')}
}
async function ingestText(k,text){
  try{await ingestText2(k,text)}catch(e){console.error(e);toast('No pude procesar: '+(e&&e.message||e))}
}
async function ingestText2(k,text){
  if(!String(text||'').trim()){toast('La caja está vacía. Pegá el contenido o subí un archivo (se guarda solo al subirlo).');return}
  const rows=parseAny(text);
  if(!rows.length){toast('No reconocí el contenido. Probá pegar el CSV o JSON completo.');return}
  if(k==='prices'){const r=ingest.prices(rows);if(!Object.keys(r.cur).length){toast('No encontré columnas de ticker y precio.');return}
    Object.assign(state.mkt.prices,r.cur);for(const tk in r.hist)state.mkt.hist[tk]=r.hist[tk];}
  else{let r=ingest[k](rows);if(!r.length){toast('No encontré columnas de fecha y valor.');return}
    if(k==='spy'&&$('#spyArs')?.checked){const fx=state.mkt.fx,fm=+state.mkt.fxManual||0;if(!fx.length&&!fm){toast('Cargá primero el dólar CCL para convertir la serie.');return}r=r.map(x=>{const i=lastLE(fx,x.t);const f=fx.length?fx[i<0?0:i].v:fm;return {t:x.t,v:x.v/f}})}
    state.mkt[k]=r}
  await persistMkt();recompute();render();
  const held=M?M.list.filter(p=>p.qty>0):[],miss=held.filter(p=>!p.hasCur).map(p=>p.tk);
  toast(k==='prices'&&M?`Guardado: ${held.length-miss.length} de ${held.length} posiciones con cotización${miss.length&&miss.length<=8?'. Faltan: '+miss.join(', '):''}`:'Datos guardados');
}
async function download(name,data,type='text/plain'){
  try{const d=await window.claude?.use?.('downloads');if(d){await d.save({filename:name,data:new Blob([data],{type})});return}}catch(e){if(e&&e.code==='declined')return}
  try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast('Descarga no disponible en esta vista')}
}

    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tocá de nuevo para confirmar';el.classList.add('primary');return}

  }

document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='fileExcel'&&t.files[0]){importExcel(t.files[0]);t.value=''}
  else if(t.dataset.ingest&&t.files[0]){const k=t.dataset.ingest,f=t.files[0];const rd=new FileReader();
    if(/\.xlsx$/i.test(f.name)){rd.onload=()=>{const wb=XLSX.read(rd.result,{type:'array'});ingestText(k,XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]))};rd.readAsArrayBuffer(f)}
    else{rd.onload=()=>{if(!rd.result){toast('El archivo '+f.name+' llegó vacío');return}toast('Leyendo '+f.name+' ('+nfARS.format(rd.result.length)+' caracteres)…');ingestText(k,rd.result)};rd.onerror=()=>toast('No pude leer el archivo.');rd.readAsText(f)}t.value=''}
  else if(t.id==='fSide'){state.fSide=t.value;render();const e=$('#fSide');e&&e.focus()}
});
document.addEventListener('input',ev=>{if(ev.target.id==='fTk'){state.fTk=ev.target.value;clearTimeout(input.h);input.h=setTimeout(()=>{render();const e=$('#fTk');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},180)}});
function input(){}
['dragover','dragenter'].forEach(e=>document.addEventListener(e,ev=>{if(ev.dataTransfer?.types?.includes('Files')){ev.preventDefault();document.body.classList.add('drop')}}));
['dragleave','drop'].forEach(e=>document.addEventListener(e,ev=>{if(e==='drop'||ev.target===document.documentElement)document.body.classList.remove('drop')}));
document.addEventListener('drop',ev=>{ev.preventDefault();const f=ev.dataTransfer?.files?.[0];if(f)importExcel(f)});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{charts.forEach(f=>f())},150)});

/* ============ arranque ============ */
(async()=>{
  render();
  await store.init();
  const d=await store.load();
  state.raw=d.movs||{};
  if(d.mkt)mergeMkt(d.mkt);
  await loadAuto();
  state.meta=d.meta;state.loaded=true;
  window.__app={ingest,state,recompute,render,importExcel,loadRows(rows){const inc=rawFromSheet(rows);const {rows:m}=mergeRaw(rawList(),inc);state.raw={};for(const r of m)(state.raw[shardOf(r)]||(state.raw[shardOf(r)]=[])).push(r);recompute();render()},get M(){return M},get B(){return B}};
  recompute();render();
})();
})();
</script>
